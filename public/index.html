<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="description" content="Nexus — Social + AI">
<title>Nexus — Social + AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<!-- ===== ONBOARDING OVERLAY ===== -->
<div class="onb-overlay show" id="onboarding">
<div class="onb-box">
<div class="onb-logo" id="onbLogo">N</div>
<div class="onb-step" id="onbStep">Step 1 of 7</div>
<div class="onb-title" id="onbTitle">Welcome to Nexus</div>
<div class="onb-desc" id="onbDesc"></div>
<div class="onb-body" id="onbBody"></div>
<div class="onb-dots" id="onbDots"></div>
<div class="onb-btns">
<button class="onb-btn secondary" id="onbBackBtn" style="display:none" onclick="onbPrev()">Back</button>
<button class="onb-btn" id="onbBtn" onclick="onbNext()">Get Started</button>
</div>
</div>
</div>

<!-- ===== COMMAND PALETTE ===== -->
<div class="overlay" id="cmdOverlay" role="button" tabindex="-1" aria-label="Close command palette" onclick="closeCmdPalette(event)"></div>
<div class="cmd-palette" id="cmdPalette">
<div class="cmd-search">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="text" id="cmdInput" placeholder="Search or run a command..." oninput="filterCmd()" onkeydown="handleCmdKey(event)">
</div>
<div class="cmd-results" id="cmdResults"></div>
</div>

<!-- ===== DRAWER ===== -->
<div class="overlay" id="drawerOverlay" role="button" tabindex="-1" aria-label="Close drawer" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
<div class="drawer-header">
<button class="icon-btn" onclick="closeDrawer()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6" stroke-linecap="round"/></svg></button>
<h3 id="drawerTitle">Title</h3>
</div>
<div class="drawer-content" id="drawerContent"></div>
</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer" onclick="closeLightbox(event)">
<button class="lightbox-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-linecap="round"/></svg></button>
<div id="lightboxContent"></div>
</div>

<!-- ===== TOAST CONTAINER ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== APP SHELL ===== -->
<div class="app-shell" id="appShell">
<header class="main-header">
<h1 id="pageTitle">Home</h1>
<div class="header-actions">
<div class="search-bar" role="button" tabindex="0" aria-label="Search Nexus" onclick="openCmdPalette()" onkeydown="if(event.key==='Enter'){openCmdPalette()}" style="cursor:pointer">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="text" placeholder="Search Nexus..." readonly style="cursor:pointer">
</div>
<button class="icon-btn" onclick="openCmdPalette()" title="Command Palette" aria-label="Command Palette">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M6 12h.01M10 12h2M14 12h.01M6 16h8"/></svg>
</button>
<button class="icon-btn" onclick="nav('notifications')" title="Notifications" aria-label="Notifications">
<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>
</header>

<nav class="left-nav">
<div class="nav-logo"><div class="logo-mark">N</div><span class="logo-text">Nexus</span></div>
<div class="nav-items">
<div class="nav-item active" data-nav="home" role="button" tabindex="0" aria-label="home" onclick="nav('home')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('home')}"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></div>
<div class="nav-item" data-nav="messages" role="button" tabindex="0" aria-label="messages" onclick="nav('messages')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('messages')}"><svg viewBox="0 0 24 24"><path d="M8 10h8M8 14h5M21 11.5a8.5 8.5 0 01-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1121 11.5z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Messages</span><span class="badge-count" id="msgBadge">3</span></div>
<div class="nav-item" data-nav="ai" role="button" tabindex="0" aria-label="ai" onclick="nav('ai')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('ai')}"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6L12 2z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AI</span></div>
<div class="nav-item" data-nav="media" role="button" tabindex="0" aria-label="media" onclick="nav('media')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('media')}"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Media</span></div>
<div class="nav-item" data-nav="profile" role="button" tabindex="0" aria-label="profile" onclick="nav('profile')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('profile')}"><svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14c-4 0-8 2-8 6v1h16v-1c0-4-4-6-8-6z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Profile</span></div>
<div class="nav-item" data-nav="notifications" role="button" tabindex="0" aria-label="notifications" onclick="nav('notifications')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('notifications')}" style="position:relative"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Notifications</span><span class="badge-dot"></span></div>
<div class="nav-item" data-nav="settings" role="button" tabindex="0" aria-label="settings" onclick="nav('settings')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('settings')}" style="margin-top:auto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H10a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V10a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Settings</span></div>
</div>
<div class="nav-footer"><div class="nav-user" role="button" tabindex="0" aria-label="View profile" onclick="nav('profile')" onkeydown="if(event.key==='Enter'){nav('profile')}"><div class="avatar sm" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">A</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">Alinda Sarvam</div><div style="font-size:11px;color:var(--muted)">@alinda</div></div></div></div>
</nav>

<div class="main">
<div class="main-scroll" id="mainScroll">
<div class="screen active" id="screen-home"><div class="main-content" id="homeContent"></div></div>
<div class="screen flex-screen" id="screen-messages"><div class="msg-layout" id="msgRoot"></div></div>
<div class="screen flex-screen" id="screen-ai"><div class="ai-root" id="aiRoot"></div></div>
<div class="screen flex-screen" id="screen-media"><div id="mediaRoot" style="width:100%;height:100%;overflow-y:auto"></div></div>
<div class="screen" id="screen-notifications"><div class="main-content" id="notifRoot"></div></div>
<div class="screen" id="screen-profile"><div class="main-content" id="profileRoot"></div></div>
<div class="screen" id="screen-settings"><div class="main-content" id="settingsRoot"></div></div>
</div>
</div>

<aside class="right-rail" id="rightRail">
<div class="rail-section" id="railTrending"><div class="rail-title">Trending</div></div>
<div class="rail-section" id="railSuggest"><div class="rail-title">Who to Follow</div></div>
</aside>
</div>

<nav class="bottom-nav" id="bottomNav">
<div class="bottom-nav-items">
<div class="bn-item active" data-bn="home" role="button" tabindex="0" aria-label="home" onclick="nav('home')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('home')}"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></div>
<div class="bn-item" data-bn="messages" role="button" tabindex="0" aria-label="messages" onclick="nav('messages')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('messages')}"><svg viewBox="0 0 24 24"><path d="M8 10h8M8 14h5M21 11.5a8.5 8.5 0 01-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1121 11.5z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Messages</span></div>
<div class="bn-item" data-bn="ai" role="button" tabindex="0" aria-label="ai" onclick="nav('ai')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('ai')}"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6L12 2z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AI</span></div>
<div class="bn-item" data-bn="media" role="button" tabindex="0" aria-label="media" onclick="nav('media')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('media')}"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Media</span></div>
<div class="bn-item" data-bn="profile" role="button" tabindex="0" aria-label="profile" onclick="nav('profile')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('profile')}"><svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14c-4 0-8 2-8 6v1h16v-1c0-4-4-6-8-6z" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Profile</span></div>
</div>
</nav>

<button class="fab" id="fab" onclick="openComposer()" aria-label="Create post">
<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
</button>

<div class="mini-player" id="miniPlayer">
<div class="mp-progress"><div class="mp-progress-fill" id="mpProg"></div></div>
<div class="mp-art" id="mpArt">🎵</div>
<div class="mp-info"><div class="mp-title" id="mpTitle">No track</div><div class="mp-artist" id="mpArtist"></div></div>
<div class="mp-controls">
<svg viewBox="0 0 24 24" id="mpPlay" onclick="togglePlay()"><path d="M5 3l14 9-14 9V3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div>
<script src="/js/config.js"></script>
<script src="/js/services.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
